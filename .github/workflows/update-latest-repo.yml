name: Update Latest Repo
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch Latest Repo
        run: |
          # Fetch the latest public repository excluding this profile repo
          REPO_DATA=$(curl -s "https://api.github.com/users/Dhruv-mavani/repos?sort=created&direction=desc" | jq -r '[.[] | select(.name != "Dhruv-mavani")][0]')
          REPO_NAME=$(echo $REPO_DATA | jq -r '.name')
          REPO_URL=$(echo $REPO_DATA | jq -r '.html_url')
          REPO_DESC=$(echo $REPO_DATA | jq -r '.description // "No description provided."')
          
          # Create the new link string
          NEW_CONTENT="- **[$REPO_NAME]($REPO_URL)**: $REPO_DESC"
          
          # Use sed to replace the content between markers
          sed -i "/<!-- LATEST_REPO_START -->/,/<!-- LATEST_REPO_END -->/{ /<!-- LATEST_REPO_START -->/b; /<!-- LATEST_REPO_END -->/b; d }" README.md
          sed -i "/<!-- LATEST_REPO_START -->/a $NEW_CONTENT" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest repo" || exit 0
          git push
