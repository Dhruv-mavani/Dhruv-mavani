name: Update Latest Repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: update-latest-repo
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Update Content
        run: |
          REPO_DATA=$(curl -s "https://api.github.com/users/dhruv-mavani/repos?sort=created&direction=desc" | jq -r '[.[] | select(.name != "dhruv-mavani")][0]')
          REPO_NAME=$(echo $REPO_DATA | jq -r '.name')
          REPO_HTML_URL=$(echo $REPO_DATA | jq -r '.html_url')
          REPO_HOMEPAGE=$(echo $REPO_DATA | jq -r '.homepage')
          REPO_DESC=$(echo $REPO_DATA | jq -r '.description // "No description provided."')
          
          if [[ "$REPO_HOMEPAGE" != "null" && "$REPO_HOMEPAGE" != "" ]]; then
              TARGET_URL=$REPO_HOMEPAGE
          else
              TARGET_URL=$REPO_HTML_URL
          fi
          
          NEW_CONTENT="- **[$REPO_NAME]($TARGET_URL)**: $REPO_DESC"
          
          sed -i '/<!-- LATEST_REPO_START -->/,/<!-- LATEST_REPO_END -->/{ /<!-- LATEST_REPO_START -->/b; /<!-- LATEST_REPO_END -->/b; d }' README.md
          sed -i "/<!-- LATEST_REPO_START -->/a $NEW_CONTENT" README.md

      - name: Update README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest project link" || exit 0
          git pull --rebase  # Add this line
          git push
